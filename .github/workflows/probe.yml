name: probe
on:
  workflow_dispatch:
    inputs:
      minutes:
        default: "120"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests && python probe.py
        env:
          MINUTES: ${{ inputs.minutes }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          WORKER_URL: https://onepiece-snapshot-trigger.miniworld7373-daf.workers.dev
