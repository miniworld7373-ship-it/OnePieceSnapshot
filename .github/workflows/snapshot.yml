name: snapshot
# Pressed every 10 min by the Cloudflare Worker in trigger/ (GitHub's own cron never fired here).
on:
  workflow_dispatch:
concurrency: snapshot
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests && python snapshot.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          WORKER_URL: https://onepiece-snapshot-trigger.miniworld7373-daf.workers.dev
